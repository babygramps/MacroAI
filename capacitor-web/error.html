<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MacroAI — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #f5f5f7;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      .accent {
        color: #ff6b35;
      }
      p {
        margin: 0 0 1.5rem;
        color: #a1a1aa;
      }
      button {
        background: #ff6b35;
        color: #0a0a0f;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="accent">Macro</span>AI can&rsquo;t connect</h1>
      <p>Check your internet connection and try again.</p>
      <button onclick="window.location.replace('https://macroai-gold.vercel.app')">Retry</button>
    </div>
  </body>
</html>
